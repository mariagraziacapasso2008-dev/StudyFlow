<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <title>Pomodoro</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

<div class="container">

    {% include "navbar.html" %}

    <h1>⏱️ Pomodoro</h1>

    <div class="card">

        <h2 id="timer">25:00</h2>
        <h3 id="status">💪 Focus attivo</h3>

        <button onclick="start()">Start</button>
        <button onclick="pause()" id="pauseBtn">Pausa</button>
        <button onclick="reset()">Reset</button>

    </div>

</div>

<script>
let time = 1500;
let breakTime = 300;
let interval = null;
let isBreak = false;
let isPaused = false;

function update(){
    let current = isBreak ? breakTime : time;

    let m = Math.floor(current / 60);
    let s = current % 60;

    document.getElementById("timer").innerText =
        m + ":" + (s < 10 ? "0" : "") + s;

    document.getElementById("status").innerText =
        isBreak ? "☕ Pausa" : "💪 Focus";
}

function start(){
    if(interval) return;

    interval = setInterval(() => {

        if(isPaused) return;

        if(isBreak){
            breakTime--;
            if(breakTime <= 0){
                reset();
                alert("Fine pausa ☕");
            }
        } else {
            time--;
            if(time <= 0){
                startBreak();
                alert("Pausa ☕");
            }
        }

        update();

    }, 1000);
}

function pause(){
    isPaused = !isPaused;
    document.getElementById("pauseBtn").innerText =
        isPaused ? "Riprendi" : "Pausa";
}

function reset(){
    clearInterval(interval);
    interval = null;
    time = 1500;
    breakTime = 300;
    isBreak = false;
    isPaused = false;
    update();
}

function startBreak(){
    isBreak = true;
    breakTime = 300;
}

update();
</script>

</body>
</html>
